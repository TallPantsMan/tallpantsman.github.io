name: Autonomous Blogger Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 14 * * 2' # Runs at 14:00 UTC every Tuesday
  workflow_dispatch: # Allows manual trigger for testing via GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the new blog post

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-antigravity

      - name: Run Autonomous Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/autonomous_blogger.py > debug_log.txt 2>&1 || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug_log.txt
          git commit -m "chore: upload debug logs" || echo "no changes"
          git push origin HEAD:main

name: Autonomous Blogger Pipeline

on:
  schedule:
    - cron: '0 14 * * 2' # Runs at 14:00 UTC every Tuesday
  workflow_dispatch: # Allows manual trigger for testing via GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the new blog post

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-antigravity

      - name: Run Autonomous Blogger
        env:
          # Required Environment Variable. Must be configured in Repo Settings -> Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/autonomous_blogger.py

      - name: Commit and Push New Post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog/*.md
          git commit -m "docs: publish autonomous blog post" || echo "No changes to commit"
          git push
